version: 2

models:
  - name: restaurants__benefit_orders_hourly
    tests:
      - dbt_utils.equality:
          compare_model: ref('expect_restaurants__benefits_orders_hourly')
          tags: 'unit_testing'



unit_tests:
  - name: test_is_valid_sum
    description: "Check my is_valid_sum in restaurants__benefits_orders"
    model: restaurants__benefit_orders_hourly
    given:
      - input: ref('base_dishes')
        rows:
          - { identifier: 1 }
      - input: ref('stg_orders__dishes_flattened')
        rows:
          - { dishes_id: 1 }
          - { dishes_id: 1 }
    expect:
      rows:
        - { identifier: 1, nb_ordered: 2 }

         
